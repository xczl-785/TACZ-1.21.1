<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaCZ 枪械检查工作台</title><link rel="stylesheet" href="style.css"></head>
<body><header><div><h1>TaCZ 枪械检查工作台</h1><p id="identity">正在连接实验室…</p></div><div class="status" id="status">准备中</div></header>
<main><aside class="controls"><section><h2>观察对象</h2><label>枪械<select id="weapon"></select></label><div class="actions"><button id="reset">恢复默认装配</button><button id="rebuild">重新编译输入</button></div></section>
<section><h2>装配槽位</h2><label>槽位<select id="slot"></select></label><label>候选配件<select id="candidate"></select></label><div class="actions"><button id="apply" class="primary">预览安装</button><button id="remove">拆下</button></div><p id="slot-detail" class="detail"></p></section>
<section><h2>坐标诊断</h2><label class="check"><input id="anchors" type="checkbox" checked>显示零件原点</label><dl><dt>装配完整性</dt><dd id="validation">—</dd><dt>当前节点</dt><dd id="node">—</dd><dt>节点来源</dt><dd id="origin">—</dd><dt>附件原点</dt><dd id="attachment-origin">—</dd></dl><p class="hint">槽位锚点和附件原点由共享模型合同计算；TaCZ 原生骨骼枢轴不在网页中伪造。</p></section></aside>
<section class="viewport"><div class="toolbar"><button id="left">左视</button><button id="side">侧视</button><button id="oblique">斜视</button><button id="fit">适配画面</button><button id="save">保存截图</button><span id="recipe"></span></div><canvas id="scene"></canvas><div id="message">拖拽旋转 · 滚轮缩放 · 点击零件可查看节点</div></section>
<aside class="tree"><h2>当前装配节点</h2><div id="parts"></div><details open><summary>范围与差异</summary><ul><li>使用生产装配目录与共享坐标计算。</li><li>这是中性材质诊断，不冒充 Minecraft 原生光照。</li><li>原生骨骼动画尚未导出时，不在浏览器补写动作。</li></ul></details></aside></main><script src="app.js"></script></body></html>
