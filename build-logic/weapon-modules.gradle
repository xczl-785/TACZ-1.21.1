// TaCZ keeps its legacy profile reader and renderer/UI adapters; firearm rules and pure presentation come from the public platform.
// The rule, presentation and workbench tests now ship with the firearms Mod that owns those classes.
def weaponModules = ['weapon_runtime']
def weaponTestModules = weaponModules
weaponModules.each { name ->
    sourceSets.main.java.srcDir("modules/${name}/src/main/java")
    sourceSets.main.resources.srcDir("modules/${name}/src/main/resources")
}
def publicLock = new groovy.json.JsonSlurper().parse(file('modules/public-dependency-lock.json'))
def pinnedRow = { module -> publicLock.artifacts.find { it.module == module && it.scope == 'main' } }
def foundationArtifact = file(pinnedRow('foundation').artifact)
def firearmsArtifact = file(pinnedRow('firearms').artifact)
repositories { maven { url = 'https://maven.firstdark.dev/snapshots' } }
configurations { weaponTestLibraries }
dependencies {
    weaponTestLibraries platform('org.junit:junit-bom:5.11.4')
    weaponTestLibraries 'org.junit.jupiter:junit-jupiter'
    weaponTestLibraries 'org.junit.platform:junit-platform-launcher'
    weaponTestLibraries 'com.google.code.gson:gson:2.10.1'
    weaponTestLibraries 'org.joml:joml:1.10.5'
    weaponTestLibraries 'org.apiguardian:apiguardian-api:1.1.2'
    implementation files(foundationArtifact, firearmsArtifact)
    implementation "com.lowdragmc.ldlib2:ldlib2-neoforge-1.21.1:${publicLock.ldlib2}:all"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.register('verifyPublicDependency') {
    inputs.files(foundationArtifact, firearmsArtifact)
    inputs.file('modules/public-dependency-lock.json')
    doLast {
        assert java.security.MessageDigest.getInstance('SHA-512').digest(foundationArtifact.bytes).encodeHex().toString() == pinnedRow('foundation').sha512
        assert java.security.MessageDigest.getInstance('SHA-512').digest(firearmsArtifact.bytes).encodeHex().toString() == pinnedRow('firearms').sha512
    }
}
tasks.register('verifyVendoredProvenance', Exec) {
    environment 'PYTHONDONTWRITEBYTECODE', '1'
    commandLine 'python3', 'tools/verify_vendored_provenance.py'
}
tasks.named('compileJava') { dependsOn 'verifyPublicDependency' }
weaponTestModules.each { name ->
    def tests = sourceSets.create("${name}Test") {
        java.srcDir("modules/${name}/src/test/java")
        resources.srcDir("modules/${name}/src/test/resources")
        compileClasspath = sourceSets.main.output + files(firearmsArtifact) + configurations.weaponTestLibraries
        runtimeClasspath = output + sourceSets.main.output + files(firearmsArtifact) + configurations.weaponTestLibraries
    }
    def verify = tasks.register("${name}Test", Test) {
        testClassesDirs = tests.output.classesDirs
        classpath = tests.runtimeClasspath
        useJUnitPlatform()
        workingDir file("modules/${name}")
        inputs.files(fileTree("modules/${name}/src/test/fixtures"), fileTree("modules/${name}/src/test/resources"))
    }
    tasks.named('check') { dependsOn verify }
}
tasks.register('compilePureJava') {
    dependsOn 'verifyPublicDependency'
    inputs.file(firearmsArtifact)
    doLast {
        new java.util.zip.ZipFile(firearmsArtifact).withCloseable { jar ->
            def names = jar.entries().collect { it.name }
            ['AssemblyNode', 'AssemblyCatalog', 'AssemblyEngine', 'PartDefinition', 'WeaponStats', 'FiringReadiness'].each { type ->
                assert names.contains("dev/firearms/assembly/${type}.class".toString())
            }
            ['AssemblyMaterials', 'HandPlacement', 'ModelGeometry', 'RecoilResponse', 'ShotSpring', 'WeaponPresentation'].each { type ->
                assert names.contains("dev/firearms/presentation/${type}.class".toString())
            }
            ['AssemblySession', 'WorkbenchAccess', 'WorkbenchInventoryHost', 'WorkbenchInventoryHosts', 'WorkbenchProposalSessions'].each { type ->
                assert names.contains("dev/firearms/workbench/${type}.class".toString())
            }
            ['AmmunitionIdentity', 'AmmunitionSupply', 'AmmunitionSupplies', 'BallisticSnapshot', 'FeedState'].each { type ->
                assert names.contains("dev/firearms/ammunition/${type}.class".toString())
            }
            assert !names.any { it.startsWith('com/tacz/') || it.startsWith('dev/tacticaltacz/') }
        }
    }
}
neoForge {
    mods {
        tacz { }
    }
    runs {
        configureEach { loadedMods = [mods.tacz] }
    }
}
tasks.register('verifyWeaponModules', Exec) {
    environment 'PYTHONDONTWRITEBYTECODE', '1'
    commandLine 'python3', 'tools/verify_weapon_modules.py'
}
tasks.named('check') { dependsOn 'compilePureJava', 'verifyWeaponModules', 'verifyVendoredProvenance' }
